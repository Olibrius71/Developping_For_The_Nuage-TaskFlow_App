{{- $services := list "api-gateway" "task-service" "user-service" "notification-service" }}
{{- range $svc := $services }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ $svc }}
  namespace: {{ $.Release.Namespace }}
  labels:
    release: monitoring
spec:
  namespaceSelector:
    matchNames:
      - staging
  selector:
    matchLabels:
      app: {{ $svc }}
  endpoints:
    - port: http
      path: /metrics
{{- end }}
